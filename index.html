/* Child-friendly touch surface: vertical scrolling only, no selection/callout. */
html,body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;-webkit-text-size-adjust:100%}
@supports (overflow:clip){html,body{overflow-x:clip}}
*,*::before,*::after{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
img,svg{-webkit-user-drag:none}
.wrap,.view,.game,.tiles,.animal-grid,.choice-grid,.phone,.bubble-field{min-width:0;max-width:100%}
.game,.bubble-field{overflow:hidden}
.bubble-field,.bubble-field *{touch-action:none}
::selection{background:transparent;color:inherit}

.big-btn:disabled{opacity:1;box-shadow:none}
.big-btn.done{background:#d1eaca}
.play-scene{position:relative;isolation:isolate;overflow:hidden;min-height:235px;border-radius:28px;background:#d6efff;display:grid;place-items:center;margin-bottom:15px}

function tractor(){warm(['engine','horn','collect','garden','splash','dog','cow','horse','duck']);let cargo=0,mode='drive',busy=false;const tabs=make('div','tractor-tabs');game.append(tabs);const s=make('div','play-scene tractor-world'),art=make('div','tractor-art'),bag=make('div','tractor-cargo','⭐ 0');art.innerHTML=tractorSVG;s.append(art,bag);game.append(s);const caption=make('div','play-caption','Привет, солнышко!');game.append(caption);const controls=make('div','tractor-controls');game.append(controls);const actions=make('div','big-grid three');game.append(actions);function drive(){if(busy)return;busy=true;stopClips();sample('engine',.25);art.classList.remove('drive');void art.offsetWidth;art.classList.add('drive');caption.textContent='Бр-р-р! Поехали!';later(()=>{busy=false;art.classList.remove('drive')},850)}
function add(b,k,msg){cargo++;bag.textContent='⭐ '+cargo;caption.textContent=msg;tapSample(k,b);party(b);if(cargo%3===0)later(()=>say('Ура! Молодец!'),350)}
controls.append(big('▶️','Ехать',drive,'#b8dfae'),big('📣','Бип-бип',b=>tapSample('horn',b),'#ffe2a0'),big('💬','Голос',()=>say('Привет, солнышко! Давай играть!'),'#e4d5f8'));
const modes=[['drive','🚜 Поехали'],['harvest','🥕 Урожай'],['farm','🐮 Зверята'],['color','🎨 Цвета']];
function render(){actions.replaceChildren();tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));if(mode==='drive'){caption.textContent='Нажми на трактор или кнопки';[['🌳','Дерево','garden'],['🏠','Домик','bell'],['💧','Лужа','splash']].forEach(([e,n,k])=>actions.append(big(e,n,b=>add(b,k,'Бип-бип! Едем дальше!'))))}else if(mode==='harvest'){caption.textContent='Собери урожай в прицеп';['🥕','🍎','🌽','🍓','🍐','🍅'].forEach(e=>actions.append(big(e,'',b=>add(b,'collect','Урожай в прицепе!'))))}else if(mode==='farm'){caption.textContent='Кого повезём на ферму?';[['🐮','Коровка','cow'],['🐴','Лошадка','horse'],['🐶','Щенок','dog'],['🐑','Овечка','sheep'],['🐷','Хрюшка','pig'],['🦆','Уточка','duck']].forEach(([e,n,k])=>actions.append(big(e,n,b=>add(b,k,n+' едет с нами!'))))}else{const target=shuffled(palette)[0];caption.textContent='Найди '+target[0];say('Найди '+target[0]);shuffled([target,...shuffled(palette.filter(p=>p!==target)).slice(0,2)]).forEach(p=>{const b=big('','',()=>{if(p===target){if(b.disabled)return;b.disabled=true;good(b);cargo++;bag.textContent='⭐ '+cargo;later(()=>{if(mode==='color')render()},1600)}else say('Попробуй ещё')},p[1]);b.setAttribute('aria-label',p[0]);actions.append(b)})}}
modes.forEach(([id,label])=>{const b=btn('',label,()=>{mode=id;stopClips();render()});b.dataset.mode=id;tabs.append(b)});art.setAttribute('role','button');art.setAttribute('tabindex','0');art.setAttribute('aria-label','Поехали');art.onclick=drive;art.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();drive()}};render();say('Привет, солнышко! Давай играть!')}
function match(){game.replaceChildren();let target=shuffled(['🍎','🐶','🦋','🚗','🍓','🧸','🌻','🐱'])[0];let locked=false;prompt('Найди такую же картинку');const {s}=scene(target);s.style.minHeight='155px';const g=playGrid(true);shuffled([target,...shuffled(['🍎','🐶','🦋','🚗','🍓','🧸','🌻','🐱'].filter(x=>x!==target)).slice(0,2)]).forEach(e=>g.append(big(e,'',b=>{if(locked)return;if(e===target){locked=true;good(b);later(match,1700)}else{sample('tap',.2);say('Попробуй ещё')}})))}
function feed(){const foods=[['🐰','🥕'],['🐮','🌿'],['🐱','🐟'],['🐵','🍌'],['🐻','🍯'],['🐶','🦴']];let i=0;function show(){game.replaceChildren();const [animal,food]=foods[i%foods.length];prompt('Покорми друга');const {icon}=scene(animal);const g=playGrid(true);let locked=false;shuffled([food,...shuffled(foods.map(x=>x[1]).filter(x=>x!==food)).slice(0,2)]).forEach(e=>g.append(big(e,'',b=>{if(locked)return;if(e===food){locked=true;icon.textContent='😋';good(b);sample('collect',.2);later(()=>{i++;show()},1700)}else say('Попробуй ещё')})))}show()}
function paint(){prompt('Рисуй пальчиком');const canvas=make('canvas','paint-canvas');game.append(canvas);const ctx=canvas.getContext('2d');let color='#ed7777',drawing=false,last=null;const rect=canvas.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=22;const tools=make('div','paint-tools');game.append(tools);function draw(e){const r=canvas.getBoundingClientRect(),p=[(e.clientX-r.left)*(canvas.width/dpr/r.width),(e.clientY-r.top)*(canvas.height/dpr/r.height)];ctx.strokeStyle=color;ctx.fillStyle=color;ctx.beginPath();if(last){ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke()}else{ctx.arc(p[0],p[1],11,0,Math.PI*2);ctx.fill()}last=p}canvas.addEventListener('pointerdown',e=>{if(drawing)return;drawing=true;last=null;canvas.setPointerCapture(e.pointerId);sample('tap',.18);draw(e)});canvas.addEventListener('pointermove',e=>{if(drawing&&canvas.hasPointerCapture(e.pointerId))draw(e)});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>{drawing=false;last=null});palette.forEach(([n,c],i)=>{const b=btn('color-swatch','',()=>{color=c;tools.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');say('Найди '+n)});b.style.setProperty('--bg',c);b.setAttribute('aria-label',n);b.setAttribute('aria-pressed',String(i===0));tools.append(b)});const er=btn('sound','🧽 Очистить',()=>{ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);sample('water',.25)});game.append(er)}
function garden(){warm(['water','garden','collect']);prompt('Полей семечки');const g=playGrid(true);['🌻','🌷','🌼','🌸','🪻','🌹'].forEach((e,i)=>{let step=0;g.append(big('🟤','',b=>{step=(step+1)%4;b.firstChild.textContent=['🟤','🌱','🌿',e][step];tapSample(step===3?'collect':'water',b);if(step===3){party(b);say('Молодец!')}},pastels[i]))})}
function transport(){prompt('Как звучат машинки?');const g=playGrid();[['🚗','Машинка','car'],['🚜','Трактор','engine'],['🚂','Паровоз','train'],['🚙','Бип-бип','horn']].forEach(([e,n,k])=>g.append(big(e,n,b=>tapSample(k,b))));warm(['car','engine','train','horn'])}
function drums(){prompt('Сыграй в оркестре');const g=playGrid();[['🥁','Барабан','drum'],['🔔','Колокольчик','bell'],['🎸','Гитара','guitar'],['👏','Хлопки','clap'],['🎹','Пианино','C'],['🪇','Погремушка','rattle']].forEach(([e,n,k])=>g.append(big(e,n,b=>{sample(k,.32);playAnim(b)})));warm(['drum','bell','guitar','clap','C','rattle'])}
function listen(){game.replaceChildren();let target=Math.floor(Math.random()*9),locked=false;prompt('Кто так говорит?');const play=big('🔊','Послушай',b=>tapSample(animalKeys[target],b),'#d6e8ff');play.style.width='100%';game.append(play);const g=playGrid(true);g.style.marginTop='15px';shuffled([target,...shuffled(Array.from({length:9},(_,i)=>i).filter(i=>i!==target)).slice(0,2)]).forEach(i=>g.append(big(beasts[i][0],'',b=>{if(locked)return;if(i===target){locked=true;good(b);later(listen,1700)}else say('Попробуй ещё')})));warm(animalKeys.slice(0,9))}
function sort(){game.replaceChildren();let p=shuffled(palette.slice(0,3))[0],locked=false;prompt('Положи шарик в такую же корзинку');const {icon,s}=scene('●');icon.style.color=p[1];s.style.minHeight='155px';const g=playGrid(true);shuffled(palette.slice(0,3)).forEach(c=>{const b=big('🧺','',()=>{if(locked)return;if(p===c){locked=true;good(b);later(sort,1700)}else say('Попробуй ещё')},c[1]);b.setAttribute('aria-label',c[0]);g.append(b)})}
function tapField(kind){warm(['pop','reward','boing']);prompt(kind==='stars'?'Лови звёздочки!':'Лопай шарики!');let n=0;const field=make('div','bubble-field');game.append(field);const f=feedback();function spawn(){if(active!==kind)return;const b=btn('bubble',kind==='stars'?'⭐':'🎈',()=>{b.remove();sample(kind==='stars'?'collect':'pop',.3);n++;if(n%4===0){f.textContent='Ура! ⭐';say('Ура! Молодец!')}later(spawn,220)});const sz=90,x=Math.random()*Math.max(0,field.clientWidth-sz),y=Math.random()*Math.max(0,field.clientHeight-sz);b.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+x+'px;top:'+y+'px;--bg:'+pastels[n%pastels.length]+';font-size:48px';b.setAttribute('aria-label',kind==='stars'?'Поймать звезду':'Лопнуть шарик');field.append(b)}for(let i=0;i<3;i++)later(spawn,i*130)}
function stars(){tapField('stars')}function balloons(){tapField('balloons')}
function wash(){warm(['water','splash','pop']);prompt('Помой уточку');const {s,icon}=scene('🦆');s.style.background='#d4f0ff';const g=playGrid(true);let remaining=6;for(let i=0;i<6;i++)g.append(big('🫧','',b=>{if(b.disabled)return;b.disabled=true;b.firstChild.textContent='💧';sample('pop',.25);remaining--;if(!remaining){icon.textContent='✨🦆';good(b);later(wash,2000)}},'#d6e9fb'))}
function weather(){prompt('Что сегодня на небе?');const {s,icon}=scene('☀️');const g=playGrid();[['☀️','Солнышко','garden','#ffebad'],['🌧️','Дождик','rain','#d7e4f6'],['🌈','Радуга','reward','#f3d9eb'],['💨','Ветер','wind','#e0f3f3']].forEach(([e,n,k,c])=>g.append(big(e,n,b=>{icon.textContent=e;s.style.background=c;tapSample(k,b)},c)))}
function memory(){game.replaceChildren();prompt('Найди две одинаковые пары');const cards=shuffled(['🐱','🐱','🍎','🍎']);let opened=[],busy=false,matched=0;const g=playGrid();cards.forEach((e,i)=>{const b=big('❔','',()=>{if(busy||b.disabled||opened.some(x=>x.i===i))return;b.firstChild.textContent=e;sample('tap',.22);opened.push({i,b,e});if(opened.length===2){busy=true;const [a,c]=opened;if(a.e===c.e){a.b.disabled=c.b.disabled=true;a.b.classList.add('done');c.b.classList.add('done');good(c.b,false);matched+=2;opened=[];busy=false;if(matched===4){say('Ура! Молодец!');later(memory,2000)}}else later(()=>{a.b.firstChild.textContent=c.b.firstChild.textContent='❔';opened=[];busy=false},850)}},'#e8dafa');g.append(b)})}
function size(){game.replaceChildren();let large=Math.random()<.5,e=shuffled(['🐻','🐱','🍎','🦋'])[0],locked=false;prompt(large?'Найди большого':'Найди маленького');const g=playGrid();shuffled([true,false]).forEach(isLarge=>{const b=big(e,isLarge?'Большой':'Маленький',()=>{if(locked)return;if(large===isLarge){locked=true;good(b);later(size,1700)}else say('Попробуй ещё')});b.firstChild.style.fontSize=isLarge?'88px':'38px';g.append(b)})}
function sleep(){prompt('Уложи зверят спать');const {s,icon}=scene('🌙');s.style.background='#ced7f3';const g=playGrid();[['🐰','Зайка'],['🐻','Мишка'],['🐱','Котик'],['🐶','Щенок']].forEach(([e,n])=>g.append(big(e,n,b=>{if(b.disabled)return;b.disabled=true;b.firstChild.textContent='💤';b.classList.add('done');icon.textContent='🌙';stopClips();sample('snore',.18);playAnim(b)},'#dfe5f8')))}
function build(){prompt('Построй башенку');const tower=make('div','tower');game.append(tower);const g=playGrid(true);palette.forEach(([n,c])=>{const b=big('','',()=>{if(tower.children.length>=7){tower.replaceChildren();sample('boing',.22)}const brick=make('div','brick');brick.style.background=c;tower.append(brick);sample('collect',.25);if(tower.children.length===7)good(b)},c);b.setAttribute('aria-label',n);g.append(b)})}

// iOS Safari may ignore viewport zoom restrictions, so also guard touch gestures.
const cancelTouch=e=>{if(e.cancelable)e.preventDefault()};
for(const name of ['contextmenu','selectstart','dragstart','gesturestart','gesturechange','gestureend','dblclick'])document.addEventListener(name,cancelTouch,{passive:false});
for(const name of ['touchstart','touchmove'])document.addEventListener(name,e=>{if(e.touches.length>1)cancelTouch(e)},{passive:false});
document.addEventListener('selectionchange',()=>{const selection=window.getSelection();if(selection&&!selection.isCollapsed)selection.removeAllRanges()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopClips();if(synth)synth.cancel();if(audio)audio.suspend().catch(()=>{})}});
</script></body></html>
