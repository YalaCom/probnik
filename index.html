<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;font-weight:700;overscroll-behavior:none}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;user-select:none}button:focus-visible{outline:4px solid #537fab;outline-offset:4px}button:active{transform:scale(.96)}button{transition:transform .17s,box-shadow .17s}button:disabled{cursor:default;opacity:.7}.wrap{max-width:1080px;margin:auto;padding:18px 20px calc(28px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 23px}.brand{background:none;display:flex;align-items:center;gap:9px;padding:0;font-size:30px;letter-spacing:-2px}.brand-icon{display:grid;place-items:center;width:44px;height:44px;background:#f6c66d;border-radius:16px;font-size:25px;transform:rotate(-9deg)}.sound{min-height:47px;padding:0 15px;border-radius:18px;background:#fff;border:2px solid #eddfcb;font-size:15px}.hero{position:relative;isolation:isolate;overflow:hidden;background:#f8dfa5;border-radius:36px;padding:32px 29px;display:flex;align-items:center;min-height:238px;box-shadow:0 6px 0 #edcc86}.hero-copy{position:relative;z-index:1;width:58%}.tag{font-size:12px;letter-spacing:.12em;color:#74614a;text-transform:uppercase}.hero h1{font-size:clamp(31px,5vw,56px);letter-spacing:-.055em;line-height:1.01;margin:11px 0 12px;color:#484338}.hero p{font-weight:600;font-size:clamp(14px,2vw,18px);line-height:1.4;margin:0;max-width:330px}.hero-art{position:absolute;right:0;bottom:0;width:48%;height:100%;overflow:visible}.section-title{display:flex;align-items:center;justify-content:space-between;margin:32px 0 15px}.section-title h2{font-size:23px;letter-spacing:-.04em;margin:0}.section-title span{font-size:13px;color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tile{min-height:171px;border-radius:28px;position:relative;overflow:hidden;isolation:isolate;text-align:left;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 5px 0 var(--edge);background:var(--bg)}.tile:before{content:"";position:absolute;width:112px;height:112px;border:2px dashed #ffffffa0;border-radius:50%;right:-27px;top:-18px;z-index:-1}.tile .illustration{font-size:62px;line-height:1;align-self:center;filter:drop-shadow(0 5px 0 #0000000c);margin:auto 0 12px;transform:rotate(-7deg)}.tile strong{font-size:21px;letter-spacing:-.05em;line-height:1.12}.tile small{font-size:12px;font-weight:600;margin-top:4px;opacity:.72}.tile .arrow{position:absolute;right:14px;bottom:16px;background:#ffffffa0;width:29px;height:29px;border-radius:50%;display:grid;place-items:center}.foot{text-align:center;color:#94816b;font-weight:600;font-size:12px;margin-top:27px}.view[hidden]{display:none!important}.topline{display:flex;align-items:center;gap:13px;margin-bottom:16px}.back{background:#fff;border:2px solid #eddfcb;border-radius:17px;min-height:54px;min-width:54px;font-size:25px}.topline h1{margin:0;font-size:clamp(25px,5vw,37px);letter-spacing:-.05em}.game{background:var(--white);border:2px solid #f0e4d2;border-radius:32px;padding:24px;min-height:370px}.prompt{text-align:center;font-size:clamp(19px,4vw,28px);letter-spacing:-.03em;margin:0 0 21px}.hint{text-align:center;color:var(--muted);font-weight:600;font-size:14px;margin:10px 0 0}.phone{max-width:345px;margin:auto;background:#e9d6f7;border:3px solid #cdb5e6;border-radius:43px;padding:18px;box-shadow:0 8px 0 #c2a4db}.speaker{width:49px;height:6px;border-radius:9px;margin:0 auto 12px;background:#b69bcf}.phone-screen{background:#fffdf6;border-radius:23px;min-height:114px;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:12px;overflow:hidden}.phone-face{font-size:42px;line-height:1.05}.digits{font-size:24px;letter-spacing:2px;max-width:100%;overflow-wrap:anywhere;min-height:29px}.phone-status{font-size:13px;color:#80718c;min-height:18px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.key{background:#fff9ff;border-radius:18px;min-height:58px;font-size:29px;box-shadow:0 3px 0 #d5bee7}.call-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.call,.end{border-radius:19px;min-height:58px;font-size:24px;box-shadow:0 4px 0 #00000012}.call{background:#9edcaa}.end{background:#f7b7ba}.animal-grid,.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.animal,.choice{background:var(--bg,#f7e7c9);border-radius:24px;padding:15px 9px;min-height:128px;box-shadow:0 4px 0 #0000000d;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}.animal .face{font-size:54px;line-height:1.15}.animal .name{font-size:17px}.animal.playing,.key.playing{animation:bounce .45s ease}.choice{min-height:145px;position:relative}.shape{width:79px;height:79px;display:block;filter:drop-shadow(0 5px 0 #00000010)}.circle{border-radius:50%}.square{border-radius:10px}.triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}.star{clip-path:polygon(50% 0,64% 34%,100% 38%,73% 63%,82% 100%,50% 80%,18% 100%,27% 63%,0 38%,36% 34%)}.heart{clip-path:polygon(50% 100%,7% 58%,0 35%,8% 14%,27% 4%,50% 18%,73% 4%,92% 14%,100% 35%,93% 58%)}.oval{border-radius:50%;width:94px;height:67px}.feedback{text-align:center;min-height:48px;font-size:20px;margin-top:18px;color:#47764a}.feedback.bad{color:#897248}.piano{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:24px auto;max-width:680px}.note{min-height:clamp(130px,29vw,250px);border-radius:20px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;font-size:clamp(13px,3vw,23px);background:var(--bg);box-shadow:0 6px 0 #00000016}.note.playing{transform:translateY(4px);box-shadow:none}.bubble-field{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(#dff3ff,#f8f5ff);height:clamp(300px,60vw,470px);min-height:290px}.bubble{position:absolute;display:grid;place-items:center;border-radius:50%;border:3px solid #fff9;background:radial-gradient(circle at 27% 22%,#fff 0%,#ffffff75 12%,var(--bg) 55%,#ffffff70 100%);box-shadow:inset -6px -7px 12px #fff8,0 7px 13px #6c9abc24;font-size:26px;animation:appear .35s ease both}.bubble:active{transform:scale(.8)}.bubble-count{text-align:center;font-size:22px;margin:0 0 15px}.count-display{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;min-height:130px;margin:10px auto 20px;max-width:520px;font-size:59px}.count-item{background:none;font-size:inherit;padding:2px}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.number{background:#fbe2a7;border-radius:20px;min-height:75px;font-size:34px;box-shadow:0 4px 0 #e7c77f}.celebrate{animation:bounce .5s ease}.confetti{position:fixed;pointer-events:none;z-index:10;width:12px;height:12px;border-radius:4px;animation:fall .85s ease-out forwards}@keyframes bounce{0%,100%{transform:scale(1)}35%{transform:scale(1.12) rotate(-4deg)}65%{transform:scale(.98)}}@keyframes appear{from{transform:scale(.25);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(160deg);opacity:0}}@media(max-width:620px){.wrap{padding:13px 13px 23px}.brand{font-size:28px}.hero{padding:23px 18px;min-height:196px;border-radius:27px}.hero-copy{width:61%}.hero-art{width:47%;right:-7px}.tiles{grid-template-columns:repeat(2,1fr);gap:12px}.tile{min-height:150px;padding:14px;border-radius:24px}.tile strong{font-size:19px}.tile .illustration{font-size:52px}.tile .arrow{display:none}.game{padding:15px;border-radius:25px}.animal-grid,.choice-grid{gap:9px;grid-template-columns:repeat(2,1fr)}.animal,.choice{min-height:111px}.piano{gap:5px}.note{border-radius:12px;padding-bottom:12px}.numbers{gap:5px}.number{min-height:62px;font-size:27px}.count-display{font-size:46px}.section-title{margin-top:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<script>
'use strict';
const $=s=>document.querySelector(s), game=$('#game'), menu=$('#menu'), activity=$('#activity');
const games=[
['phone','☎️','Телефон','Позвони друзьям','#e6d5fa','#cbb1e8'],
['animals','🐶','Зверята','Кто как говорит?','#c9e8c9','#add3ac'],
['colors','🎨','Цвета','Найди нужный цвет','#f9d0df','#e8b3c7'],
['shapes','🧩','Фигуры','Круг, звёздочка и другие','#cfe8fc','#b3d4ee'],
['music','🎹','Музыка','Играй мелодии','#ffe4a2','#eac87d'],
['bubbles','🫧','Пузырьки','Лопай и веселись','#d9ddfa','#bdc5ef'],
['count','🍓','Считалочка','Считаем до пяти','#ffd8b7','#edba94']];
let muted=false,active='',timers=[],audio=null,round=0,calling=false,number='',voices=[],bubbleTotal=0;
const synth=window.speechSynthesis;
function refreshVoices(){voices=synth?synth.getVoices():[]}
if(synth){refreshVoices();synth.addEventListener('voiceschanged',refreshVoices)}
function later(fn,ms){const id=setTimeout(()=>{timers=timers.filter(x=>x!==id);fn()},ms);timers.push(id);return id}
function clear(){timers.forEach(clearTimeout);timers=[];if(synth)synth.cancel();calling=false;round++}
function soundReady(){if(muted)return null;try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audio=new C()}if(audio.state==='suspended')audio.resume().catch(()=>{});return audio}catch(e){return null}}
function tone(f=520,d=.12,kind='sine',vol=.12,delay=0,end=f){let a=soundReady();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=kind;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,end),t+d);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function say(txt){if(muted)return;if(!synth){tone(600,.16);return}try{synth.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang='ru-RU';u.rate=.86;u.pitch=1.13;const v=voices.find(v=>v.lang.toLowerCase().startsWith('ru'));if(v)u.voice=v;synth.speak(u)}catch(e){tone(600,.16)}}
function chime(){[523,659,784].forEach((f,i)=>tone(f,.20,'sine',.095,i*.08))}
function pop(){tone(650,.13,'sine',.13,0,150)}
function party(el){if(!el)return;const r=el.getBoundingClientRect();for(let i=0;i<12;i++){const e=document.createElement('i');e.className='confetti';e.style.cssText='left:'+ (r.left+r.width/2)+'px;top:'+(r.top+r.height/2)+'px;background:'+['#f9a9c5','#eac46d','#a4d3ad','#a9c9f1'][i%4]+';--dx:'+Math.round((Math.random()-.5)*240)+'px;--dy:'+Math.round(-40-Math.random()*140)+'px';document.body.append(e);setTimeout(()=>e.remove(),900)}}
function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function btn(cls,txt,fn){const b=make('button',cls,txt);b.type='button';b.addEventListener('click',fn);return b}
function prompt(t){game.append(make('h2','prompt',t))}
function hint(t){game.append(make('p','hint',t))}
function feedback(){let e=make('div','feedback');e.setAttribute('aria-live','polite');game.append(e);return e}
function playAnim(e){e.classList.remove('playing');void e.offsetWidth;e.classList.add('playing');later(()=>e.classList.remove('playing'),450)}
function go(key){clear();soundReady();active=key;game.replaceChildren();menu.hidden=true;activity.hidden=false;$('#game-title').textContent=games.find(g=>g[0]===key)[2];({phone,animals,colors,shapes,music,bubbles,count}[key])();window.scrollTo(0,0)}
function home(){clear();active='';game.replaceChildren();activity.hidden=true;menu.hidden=false;window.scrollTo(0,0)}
$('#home').onclick=home;$('#back').onclick=home;
$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'🔇 Без звука':'🔊 Звук';$('#sound').setAttribute('aria-pressed',String(!muted));if(muted){if(synth)synth.cancel();if(audio)audio.suspend().catch(()=>{})}else{soundReady();tone(700,.13)}};
games.forEach(([id,emoji,title,sub,bg,edge])=>{const b=btn('tile','',()=>go(id));b.style.setProperty('--bg',bg);b.style.setProperty('--edge',edge);b.append(make('span','illustration',emoji),make('strong','',title),make('small','',sub),make('span','arrow','↗'));$('#tiles').append(b)});
function phone(){prompt('Кому сегодня позвоним?');number='';const p=make('div','phone'),screen=make('div','phone-screen'),face=make('div','phone-face','🐰'),display=make('div','digits',''),status=make('div','phone-status','Набери любой номер');p.append(make('div','speaker'));screen.append(face,display,status);p.append(screen);const keys=make('div','keys');const pairs=[[697,1209],[697,1336],[697,1477],[770,1209],[770,1336],[770,1477],[852,1209],[852,1336],[852,1477],[941,1209],[941,1336],[941,1477]];['1','2','3','4','5','6','7','8','9','*','0','#'].forEach((n,i)=>keys.append(btn('key',n,()=>{if(calling)return;number=(number+n).slice(-12);display.textContent=number;tone(pairs[i][0],.13,'sine',.055);tone(pairs[i][1],.13,'sine',.055)})));p.append(keys);const row=make('div','call-row');const friends=[['🐰','Зайка','Алло, привет! Это зайка! Прыг, скок! Как у тебя дела? Давай дружить!'],['🐻','Мишка','Алло! Это мишка! Я нашёл вкусный мёд. Ням ням! Обнимаю тебя!'],['🐱','Котик','Мяу мяу! Привет! Это котик. Ты чудесно играешь! Мур мур!'],['🐶','Щенок','Гав гав! Алло! Это щенок. Пойдём играть в мячик!'],['🐸','Лягушка','Ква ква! Привет! Прыгай вместе со мной! Ква ква!']];let next=0;function hang(){clear();number='';display.textContent='';status.textContent='Набери любой номер';face.textContent='🐰';tone(420,.15)}const call=btn('call','📞',()=>{if(calling)return;calling=true;say('Алло, звоним другу!');const f=friends[next++%friends.length];status.textContent='Звоним…';face.textContent='☎️';display.textContent=number||'···';tone(440,.32,'sine',.075);tone(480,.32,'sine',.075);later(()=>{tone(440,.32,'sine',.075);tone(480,.32,'sine',.075)},580);later(()=>{face.textContent=f[0];status.textContent=f[1]+' на связи';display.textContent='Алло!';say(f[2]);later(()=>{if(calling){status.textContent='Друг слушает';say('Бла бла бла! Хи хи! Пока пока!')}},6700);later(()=>{if(calling){calling=false;status.textContent='Позвони ещё!';display.textContent='';number=''}},12000)},1450)});call.setAttribute('aria-label','Позвонить');const end=btn('end','✕',hang);end.setAttribute('aria-label','Завершить звонок и очистить номер');row.append(call,end);p.append(row);game.append(p);hint('Это игрушечный телефон. Настоящих звонков нет.')}
const beasts=[['🐶','Собачка','Гав-гав!','#f9d9b6',180,85],['🐱','Котик','Мяу-мяу!','#f8d3dc',720,240],['🐮','Коровка','Му-у-у!','#e5e0f8',125,78],['🐥','Цыплёнок','Пи-пи-пи!','#ffe7a1',1600,1100],['🐸','Лягушка','Ква-ква!','#cce9c8',180,115],['🐷','Хрюшка','Хрю-хрю!','#f9d1df',250,100],['🐑','Овечка','Бе-е-е!','#e7e9f5',360,190],['🐴','Лошадка','И-го-го!','#f9ddb5',650,260],['🦆','Уточка','Кря-кря!','#cce6fa',410,220]];
function animals(){prompt('Нажми на зверёнка!');const grid=make('div','animal-grid');beasts.forEach(([e,n,cry,bg,f,end])=>{const b=btn('animal','',()=>{playAnim(b);tone(f,.16,'triangle',.07,0,end);tone(f,.18,'triangle',.065,.19,end);say(n+'. '+cry)});b.style.setProperty('--bg',bg);b.append(make('span','face',e),make('span','name',n));grid.append(b)});game.append(grid);hint('Зверята произносят свои голоса в игровой озвучке.')}
const palette=[['красный','#ed7777'],['жёлтый','#f6ce5f'],['синий','#6ba7e8'],['зелёный','#79bb85'],['розовый','#e9a0c1'],['фиолетовый','#aa96d9']];
const figures=[['круг','circle','#e99cae'],['квадрат','square','#82bddd'],['треугольник','triangle','#edc55d'],['звёздочка','star','#e8ad5d'],['сердечко','heart','#db88a2'],['овал','oval','#92c8a0']];
function shuffled(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function quiz(kind){let data=kind==='colors'?palette:figures, target=shuffled(data)[0],list=shuffled(data),locked=false;game.replaceChildren();const q=make('h2','prompt','Найди: '+target[0]);game.append(q);const repeat=btn('sound','🔊 Послушать',()=>say('Найди '+target[0]));repeat.style.cssText='display:block;margin:0 auto 17px';game.append(repeat);const grid=make('div','choice-grid');game.append(grid);const fb=feedback();list.forEach(item=>{const b=btn('choice','',()=>{if(locked)return;if(item===target){locked=true;fb.className='feedback';fb.textContent='Ура! Молодец! ⭐';party(b);chime();say('Ура! Молодец!');later(()=>quiz(kind),1750)}else{fb.className='feedback bad';fb.textContent='Попробуй ещё 💛';tone(330,.13);say('Попробуй ещё')}});b.setAttribute('aria-label',item[0]);b.style.setProperty('--bg','#f7f1e6');const shape=make('span','shape '+(kind==='colors'?'circle':item[1]));shape.style.background=kind==='colors'?item[1]:item[2];b.append(shape);grid.append(b)});say('Найди '+target[0])}
function colors(){quiz('colors')}function shapes(){quiz('shapes')}
function music(){prompt('Сыграй свою песенку!');const grid=make('div','piano');const notes=[['До',261.63,'#f4a8b5'],['Ре',293.66,'#f5c69c'],['Ми',329.63,'#f8dc89'],['Фа',349.23,'#b9d9a8'],['Соль',392,'#9ccfdc'],['Ля',440,'#b5b5e8'],['Си',493.88,'#d6a9dc']];notes.forEach(([n,f,bg])=>{const b=btn('note',n,()=>{tone(f,.35,'sine',.15);tone(f*2,.23,'sine',.025);playAnim(b)});b.style.setProperty('--bg',bg);grid.append(b)});game.append(grid);const play=btn('sound','♫ Сыграть мелодию',()=>{[0,1,2,0,0,1,2,0,2,3,4].forEach((n,i)=>later(()=>{tone(notes[n][1],.27);playAnim(grid.children[n])},i*290))});play.style.cssText='display:block;margin:0 auto';game.append(play);hint('Нажимай на цветные клавиши — каждая звучит по-своему.')}
function bubbles(){bubbleTotal=0;const score=make('div','bubble-count','🫧 0');score.setAttribute('aria-live','polite');game.append(score);const field=make('div','bubble-field');game.append(field);hint('Лопай пузырьки пальчиком. Они появляются снова!');const colors=['#f4a9c9','#b9d6fa','#c3b2ec','#a6dec4','#f6d98b'];function spawn(){if(active!=='bubbles')return;const w=field.clientWidth,h=field.clientHeight;if(w<70||h<70)return;let size=64+Math.random()*40;let x=Math.random()*Math.max(0,w-size),y=Math.random()*Math.max(0,h-size);for(let j=0;j<20;j++){if(![...field.children].some(e=>{const ex=parseFloat(e.style.left),ey=parseFloat(e.style.top),es=parseFloat(e.style.width);return Math.hypot(ex+es/2-x-size/2,ey+es/2-y-size/2)<(es+size)/2+4}))break;x=Math.random()*Math.max(0,w-size);y=Math.random()*Math.max(0,h-size)}const b=btn('bubble','',()=>{party(b);b.remove();pop();bubbleTotal++;score.textContent='🫧 '+bubbleTotal;if(bubbleTotal%10===0){chime();say('Ура!')}later(spawn,210)});b.setAttribute('aria-label','Лопнуть пузырёк');b.style.cssText='left:'+x+'px;top:'+y+'px;width:'+size+'px;height:'+size+'px;--bg:'+colors[Math.floor(Math.random()*colors.length)];field.append(b)}for(let i=0;i<6;i++)later(spawn,i*80)}
function count(){game.replaceChildren();let n=1+Math.floor(Math.random()*5),emoji=shuffled(['🍓','🍎','⭐','🦋','🍐'])[0],locked=false;prompt('Сколько здесь?');const display=make('div','count-display');let words=['','Один','Два','Три','Четыре','Пять'];for(let i=0;i<n;i++)display.append(btn('count-item',emoji,()=>{tone(420+i*95,.17);say(words[i+1])}));game.append(display);const grid=make('div','numbers');game.append(grid);const fb=feedback();for(let i=1;i<=5;i++)grid.append(btn('number',String(i),e=>{if(locked)return;if(i===n){locked=true;fb.className='feedback';fb.textContent='Правильно! ⭐';party(grid.children[i-1]);chime();say(words[n]+'. Молодец!');later(count,1900)}else{fb.className='feedback bad';fb.textContent='Посчитаем ещё раз 💛';say('Попробуй ещё')}}));hint('Можно нажимать на картинки и считать вместе.');say('Сколько здесь?')}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(synth)synth.cancel();if(audio)audio.suspend().catch(()=>{})}});
</script></body></html>
