/* Child-friendly touch surface: vertical scrolling only, no selection/callout. */
html,body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;-webkit-text-size-adjust:100%}
@supports (overflow:clip){html,body{overflow-x:clip}}
*,*::before,*::after{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
img,svg{-webkit-user-drag:none}
.wrap,.view,.game,.tiles,.animal-grid,.choice-grid,.phone,.bubble-field{min-width:0;max-width:100%}
.game,.bubble-field{overflow:hidden}
.bubble-field,.bubble-field *{touch-action:none}
::selection{background:transparent;color:inherit}

/* Toddler edition: generous touch targets, one action at a time. */
.tile:first-child{grid-column:1/-1;min-height:180px;background:linear-gradient(145deg,#c5e8ff,#a9d7fa);padding:20px 24px;justify-content:center;box-shadow:0 5px 0 #91bee3}
.tile:first-child .illustration{position:absolute;right:14px;top:15px;width:45%;height:85%;font-size:0;transform:none;margin:0;filter:none}
.tile:first-child .illustration svg{width:100%;height:100%}
.tile:first-child strong{font-size:clamp(25px,6vw,39px);max-width:55%;line-height:1.02}
.tile:first-child small{font-size:15px;max-width:52%;line-height:1.3}
.big-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.big-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.big-btn{min-height:108px;border-radius:26px;background:var(--bg,#f2e6d5);padding:12px 8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;box-shadow:0 4px 0 #00000012;font-size:clamp(43px,10vw,70px);line-height:1.1}
.big-btn small{font-size:15px;font-weight:750;line-height:1.2}
.big-btn.playing{animation:bounce .45s ease}
.big-btn:disabled{opacity:1;box-shadow:none}
.big-btn.done{background:#d1eaca}
.play-scene{position:relative;isolation:isolate;overflow:hidden;min-height:235px;border-radius:28px;background:#d6efff;display:grid;place-items:center;margin-bottom:15px}
.play-scene .large-emoji{font-size:100px;line-height:1.1}
.play-scene .ground{position:absolute;bottom:0;left:0;right:0;height:31%;background:#b1daa1;z-index:-1;border-radius:60% 60% 0 0}
.tractor-world{background:linear-gradient(#d9f1ff 0 66%,#c7e2a4 66%);min-height:260px;overflow:hidden}
.tractor-art{position:relative;width:min(86%,340px);transition:transform .55s ease;z-index:2}
.tractor-art svg{display:block;width:100%;height:auto}
.tractor-art.drive{animation:drive .85s ease-in-out}
@keyframes drive{0%,100%{transform:translateX(0)}35%{transform:translateX(20px) rotate(-3deg)}70%{transform:translateX(-15px) rotate(2deg)}}
.tractor-cargo{position:absolute;top:12px;right:15px;border-radius:18px;background:#fff9;padding:9px 13px;font-size:28px;z-index:3}
.tractor-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.tractor-controls .big-btn{min-height:88px;font-size:36px;border-radius:18px}
.tractor-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:15px}
.tractor-tabs button{background:#e2efff;padding:13px 6px;border-radius:16px;font-size:15px;min-height:55px}
.tractor-tabs button[aria-pressed="true"]{background:#b5dcff;box-shadow:0 3px 0 #82b8e9}
.play-caption{text-align:center;font-size:19px;min-height:29px;margin:8px 0 13px}
.color-swatch{width:58px;height:58px;border-radius:50%;background:var(--bg);min-height:58px;box-shadow:0 3px 0 #0002;border:4px solid white}
.paint-canvas{width:100%;height:340px;display:block;border-radius:24px;background:#fff;touch-action:none!important;border:2px solid #eddcc3}
.paint-tools{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:15px 0}
.paint-tools button[aria-pressed=true]{outline:3px solid #485563}
.tower{display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;height:280px;overflow:hidden;padding:12px;background:#ecf5fc;border-radius:26px;margin-bottom:15px;gap:4px}
.brick{border-radius:10px;width:128px;height:32px;flex-shrink:0;box-shadow:inset 0 -5px 0 #0001;animation:appear .25s both}
.bubble-field{height:clamp(310px,70vw,470px)}
.choice-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{min-height:120px}
.numbers{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:620px){.big-btn{min-height:112px}.choice-grid{gap:7px}.choice{padding:6px;min-height:100px}.shape{width:61px;height:61px}.oval{width:69px;height:50px}.game{padding:12px}.tile:first-child{min-height:165px}.play-scene{min-height:225px}.tractor-world{min-height:235px}}
@media(prefers-reduced-motion:reduce){.tractor-art.drive{animation:none!important}}

/* Scoped exclusively to the animal sound guessing game. */
.listen-room{max-width:780px;margin:0 auto;text-align:center;padding:2px 0 8px}
.listen-title{font-size:clamp(23px,5vw,36px);line-height:1.15;letter-spacing:-.04em;margin:0 0 14px}
.listen-play{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:80px;background:#d8eaff;border:2px solid #bdd8f2;border-radius:25px;box-shadow:0 4px 0 #b6d2ee;font-size:clamp(16px,4vw,23px);padding:10px}
.listen-speaker{font-size:39px;line-height:1}.listen-play.listening .listen-speaker{animation:bounce .8s ease-in-out 2}
.listen-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:22px 0 12px}
.listen-card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;background:#fff9eb;border:3px solid #f1e4ce;border-radius:24px;padding:8px;box-shadow:0 4px 0 #eadbc1;overflow:hidden}
.listen-card:nth-child(2){background:#eff7e8;border-color:#dbe9d2;box-shadow:0 4px 0 #d5e5cc}
.listen-picture{position:relative;width:100%;height:clamp(135px,32vw,280px);border-radius:16px;overflow:hidden;background:#fff;display:grid;place-items:center}
.listen-photo{position:absolute;width:100%;height:100%;inset:0;object-fit:contain;pointer-events:none}
.listen-fallback{font-size:clamp(66px,17vw,124px);line-height:1}.listen-name{font-size:clamp(17px,4.1vw,25px);padding:10px 0 5px}
.listen-info{min-height:46px;color:#527a56;font-size:clamp(19px,4.5vw,27px);font-weight:800;display:grid;place-items:center}
.listen-card.listen-correct{border-color:#7dc18a;background:#dff4d9;box-shadow:0 4px 0 #a9d8a4;animation:bounce .5s ease;opacity:1}
.listen-card.listen-dim,.listen-card.listen-try{opacity:.57}.listen-card.listen-hint{border-color:#a6d2a0}
@media(max-width:380px){.listen-card{padding:5px;border-radius:19px}.listen-grid{gap:9px}.listen-picture{height:135px}.listen-name{font-size:16px}}
@media(prefers-reduced-motion:reduce){.listen-card,.listen-play .listen-speaker{animation:none!important}}

let listenBag=[],listenLast=null,listenPosition=-1,listenPoolSignature='';
function listenNext(pool){
  const signature=pool.map(a=>a.id).join(',');
  if(signature!==listenPoolSignature){listenBag=[];listenPoolSignature=signature}
  if(!listenBag.length){listenBag=shuffled(pool.map(a=>a.id));if(listenBag.length>1&&listenBag[0]===listenLast){const j=1+Math.floor(Math.random()*(listenBag.length-1));[listenBag[0],listenBag[j]]=[listenBag[j],listenBag[0]]}}
  const id=listenBag.shift();listenLast=id;return pool.find(a=>a.id===id)
}
function listen(){
  game.replaceChildren();
  const media=window.LAPKI_ANIMAL_MEDIA||{};
  const pool=listenAnimals.filter(a=>a.local||media[a.id]?.audio).map(a=>({...a,audio:media[a.id]?.audio||'./assets/audio/'+a.local,image:media[a.id]?.image||null}));
  for(const a of pool)soundUrls['listen_'+a.id]=a.audio;
  const target=listenNext(pool);let locked=false,wrong=0,clipTimer=null,attempted=new Set();
  const room=make('div','listen-room');game.append(room);
  const title=make('h2','listen-title','Кто так говорит?');room.append(title);
  const play=btn('listen-play','',()=>playQuestion());play.setAttribute('aria-label','Послушать звук животного');
  play.append(make('span','listen-speaker','🔊'),make('span','','Послушай ещё раз'));room.append(play);
  const grid=make('div','listen-grid');room.append(grid);
  const info=make('div','listen-info','Найди зверёнка');info.setAttribute('aria-live','polite');room.append(info);
  const distinct=pool.filter(a=>a.id!==target.id&&a.group!==target.group&&!(target.id==='dog'&&a.id==='wolf')&&!(target.id==='wolf'&&a.id==='dog'));
  const other=shuffled(distinct.length?distinct:pool.filter(a=>a.id!==target.id))[0];
  const options=[target,other];let position=Math.random()<.5?0:1;if(listenPosition===position&&Math.random()<.65)position=1-position;listenPosition=position;if(position===1)options.reverse();
  let rightButton=null;
  function playQuestion(){if(locked||active!=='listen')return;if(clipTimer)clearTimeout(clipTimer);stopClips();sample('listen_'+target.id,.48);play.classList.remove('listening');void play.offsetWidth;play.classList.add('listening');clipTimer=later(()=>{if(!locked&&active==='listen'){stopClips();play.classList.remove('listening')}},4800)}
  for(const a of options){
    const b=btn('listen-card','',()=>{if(locked||active!=='listen'||attempted.has(a.id))return;
      if(a.id!==target.id){wrong++;attempted.add(a.id);b.classList.add('listen-try');b.disabled=true;info.textContent='Давай ещё раз 💛';if(wrong>=1&&rightButton)rightButton.classList.add('listen-hint');playQuestion();return}
      locked=true;if(clipTimer)clearTimeout(clipTimer);stopClips();play.disabled=true;play.classList.remove('listening');grid.querySelectorAll('button').forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('listen-dim')});b.classList.add('listen-correct');info.textContent=a.name+'! '+a.cry;party(b);chime();later(()=>{if(active==='listen'&&room.isConnected)listen()},1500)
    });
    if(a.id===target.id)rightButton=b;
    b.setAttribute('aria-label',a.name);const pic=make('div','listen-picture');
    const fallback=make('span','listen-fallback',a.emoji);pic.append(fallback);
    if(a.image){const img=make('img','listen-photo');img.alt=a.name;img.draggable=false;img.decoding='async';img.onload=()=>fallback.hidden=true;img.onerror=()=>img.remove();img.src=a.image;pic.append(img)}
    b.append(pic,make('span','listen-name',a.name));grid.append(b)
  }
  warm(['listen_'+target.id,'listen_'+other.id,...listenBag.slice(0,2).map(id=>'listen_'+id)]);
  later(playQuestion,120);
}

function tapField(kind){warm(['pop','reward','boing']);prompt(kind==='stars'?'Лови звёздочки!':'Лопай шарики!');let n=0;const field=make('div','bubble-field');game.append(field);const f=feedback();function spawn(){if(active!==kind)return;const b=btn('bubble',kind==='stars'?'⭐':'🎈',()=>{b.remove();sample(kind==='stars'?'collect':'pop',.3);n++;if(n%4===0){f.textContent='Ура! ⭐';say('Ура! Молодец!')}later(spawn,220)});const sz=90,x=Math.random()*Math.max(0,field.clientWidth-sz),y=Math.random()*Math.max(0,field.clientHeight-sz);b.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+x+'px;top:'+y+'px;--bg:'+pastels[n%pastels.length]+';font-size:48px';b.setAttribute('aria-label',kind==='stars'?'Поймать звезду':'Лопнуть шарик');field.append(b)}for(let i=0;i<3;i++)later(spawn,i*130)}

// iOS Safari may ignore viewport zoom restrictions, so also guard touch gestures.
const cancelTouch=e=>{if(e.cancelable)e.preventDefault()};
for(const name of ['contextmenu','selectstart','dragstart','gesturestart','gesturechange','gestureend','dblclick'])document.addEventListener(name,cancelTouch,{passive:false});
for(const name of ['touchstart','touchmove'])document.addEventListener(name,e=>{if(e.touches.length>1)cancelTouch(e)},{passive:false});
document.addEventListener('selectionchange',()=>{const selection=window.getSelection();if(selection&&!selection.isCollapsed)selection.removeAllRanges()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopClips();if(synth)synth.cancel();if(audio)audio.suspend().catch(()=>{})}});
